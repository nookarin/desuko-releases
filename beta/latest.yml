releaseNotes: |
  • Status dashboard: one window shows your AI model, chat and approvals, voice, tasks, schedules, local engine, services, browser, sandbox, updates and performance. Each card opens the widget or Settings page that changes it, and the header says whether anything needs attention (launcher or tray → Dashboard).
  • Desuko is Windows-only now: Linux support, Linux installers and the Linux test checklist are gone (ADR 0046).
