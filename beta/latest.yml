releaseNotes: |
  • Fixed: the built-in local AI could freeze the whole computer. With Context length on Auto, a model was loaded with its largest possible context (up to 256K tokens), which needed far more memory than the PC has. Auto now picks 4K to 32K tokens to fit your memory.
  • Fixed: graphics cards were not found on some PCs (the check timed out with some NVIDIA drivers), so models ran on the processor. If that happened to you, Desuko downloads the GPU engine on your next message.
  • The local AI engine runs at a lower priority, so the PC stays responsive while it answers.
  • Fixed: two requests arriving together could start the local engine twice and load the model twice.
  • Fixed: after a model failed to load, loading another one right away could still show the old error while the new model was running.
