releaseNotes: |
  • Discover: find and download local AI models, extensions (connectors) and plugins in one place (Settings → Discover, tray or the character's menu).
  • A Performance widget shows CPU and memory split by games, browsers, system and Desuko, and GPU use where Windows reports it (launcher or tray → Performance).
  • Settings → About shows what changed in this version and keeps a list of every release.
  • Live2D and 3D (VRM) characters are turned off for now; sprite characters like Mochi work as before.
