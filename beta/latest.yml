releaseNotes: |
  • Desuko now has one main window. Click the tray icon (or "Open Desuko") to see Home: what your companion is doing, a quick character switch, your recent chats (open, delete or start a new one) and the status of everything else. Every setting is in the same window's sidebar.
  • Hide widgets: a small eye button that hides every unpinned widget and brings them back. Pinned widgets stay. Find it in widget mode's launcher, or use the tray's "Hide unpinned widgets".
  • Local models now say what they need: RAM to run on the processor alone, video memory for a graphics card, and whether a graphics card is recommended.
  • Media controller: a new Media widget shows what is playing on your PC (title, artist, app) with previous, play/pause and next (launcher or tray → Media controller).
  • The character reacts to music and video with two new states. Mochi has placeholder animations for now. Turn it off in Settings → General → "React to music and video". What you play stays on your PC.
  • Sign in with OpenRouter: Settings → AI providers → OpenRouter opens your browser, you approve, and Desuko gets a key for your own OpenRouter account. No key to paste, and one account reaches models from many companies.
  • Fixed: "Show character" in the tray did nothing after the character had been closed.
