releaseNotes: |
  • Edit your characters in Character Studio after installing them: change the name, size, animations and states, then Save changes (Settings → Character → Edit).
  • Mochi has a full personality now. You can change Mochi too, and bring it back with Reset to default.
  • Desuko calls your companion by its name: "Ask Mochi…", "Message Mochi…".
  • VRM 0.x characters stand with their arms down instead of raising them above their head.
